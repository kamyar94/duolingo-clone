# Egress proxy of the Lingo stack: the only way out to the internet for the app container.
#
# It accepts HTTPS tunnels (CONNECT on port 443) to the three AI provider API hosts below and
# refuses everything else: other hosts, other ports, plain http and IP addresses. The app
# encrypts end to end through the tunnel, so the proxy sees only which host is contacted.
# This file is part of the stack configuration on the server; nothing in the web interface
# can change it.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# Exact host names; -n stops Squid from looking up names for IP addresses, so a request to
# a bare IP can never match.
acl ai_apis dstdomain -n api.openai.com api.anthropic.com generativelanguage.googleapis.com

# PHASE 4 (voice): the voice gateway on the workstation is added here as one address and one
# port, for example
#   acl voice_gateway dst 192.0.2.10/32
#   acl voice_port port 8443
#   http_access allow CONNECT voice_gateway voice_port

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT ai_apis
http_access deny all

# A pure tunnel: no cache, no identifying headers, nothing written to disk.
cache deny all
cache_mem 0 MB
forwarded_for delete
httpd_suppress_version_string on
coredump_dir /tmp
pid_filename none

# CONNECT lines show only host and port, never paths or bodies.
logformat lingo %ts.%03tu %>a %rm %ru %>Hs %<st
access_log stdio:/dev/stdout lingo
cache_log stdio:/dev/stderr
cache_store_log none
netdb_filename none
# The ICMP pinger needs raw sockets, which this container does not have.
pinger_enable off
logfile_rotate 0
