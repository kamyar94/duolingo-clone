# Lingo, hardened for a home server. Template: copy this folder next to a clone of the app in
# ./app, fill in the env files from the *.example templates, and start with
#   docker compose up -d --build
# deploy/README.md explains each service and what changed for coding lessons and math practice.
#
# Nothing here publishes a port. The only way in is a Cloudflare Tunnel: Cloudflare's edge
# terminates HTTPS for your address (for example learn.example.com) and the tunnel container
# forwards the traffic to app:3000 over a private network. The database sits on a second
# private network that only the app reaches. The app has no route to the internet; its only
# way out is the egress proxy, which allows HTTPS to the three AI provider APIs and, once you
# turn it on in squid.conf, the voice gateway on the workstation (deploy/voice) and nothing else.
#
#   tunnel  (tunnel + tunnel-out)       Cloudflare Tunnel connector, token from cloudflared.env
#   app     (tunnel + backend + egress) Lingo web app (Next.js), built from ./app, also on every
#                                       runner network
#   db      (backend)                   Postgres, data in the Docker volume "db"
#   egress  (egress + egress-out)       Squid, allowlist in squid.conf
#   runner-* (own network each)         code runners, one per language family (profile "runners")
#
# Versions are pinned in .env. No container gets a TZ setting on purpose: the database stores
# UTC times.

name: lingo

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The isolation of the code runners, shared by every runner service below. The runner service
# is process 1 of its container. It has no health check on purpose, because a check would run
# a second process with the container's environment next to the learner's program. Docker
# restarts a runner when it ends, and a runner ends on its own when idle after
# LINGO_RUNNER_MAX_JOBS jobs or LINGO_RUNNER_MAX_UPTIME_MIN minutes, so runners are recycled.
x-runner: &runner
  <<: *hardening
  pull_policy: never
  user: "10001:10001"
  read_only: true
  # The only writable place, for scratch folders and build output. It is emptied after every
  # job. exec is needed to run compiled programs.
  tmpfs:
    - /tmp:size=256m,mode=1777,exec
  shm_size: 16m
  ipc: private
  env_file:
    - path: runner.env
      required: false
  # The runner holds no state, so stopping it at once loses nothing.
  stop_signal: SIGKILL
  ulimits:
    core: 0
    nofile:
      soft: 4096
      hard: 4096
  mem_limit: 768m
  memswap_limit: 768m
  cpus: 1.0
  pids_limit: 128

services:
  # Accounts, courses and progress. Runs as the unprivileged postgres user (70) on a read-only
  # root filesystem; the data lives in a Docker volume.
  db:
    <<: *hardening
    image: postgres:${POSTGRES_VERSION:?set POSTGRES_VERSION in .env}
    container_name: lingo-db
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,mode=1777
      - /tmp:size=64m,mode=1777
    env_file: db.env
    volumes:
      - db:/var/lib/postgresql # THE DATA. Back it up before every update.
      - ./backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128m
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200

  # The web app, built from ./app. Runs as the unprivileged node user on a read-only root
  # filesystem; it only reads ./media and ./courses. ai.env holds LINGO_SECRET_KEY, which
  # encrypts the learners' AI keys, and the voice token; no other container reads it. The one
  # writable place is the voice-data volume, where the narration audio made by the voice server
  # is kept (separate from ./media, which stays read-only).
  app:
    <<: *hardening
    build:
      context: ./app
      args:
        NODE_VERSION: ${NODE_VERSION:?set NODE_VERSION in .env}
    image: lingo-app:local
    pull_policy: never
    container_name: lingo-app
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    env_file:
      - .env
      - db.env
      - ai.env
      # RUNNER_TOKEN, shared with the runners. Without it, server languages are unavailable.
      - path: runner.env
        required: false
    environment:
      - PGHOST=db
      - MEDIA_DIR=/media
      # AI provider requests leave only through the egress proxy.
      - AI_PROXY_URL=http://egress:3128
      # Voice: VOICE_URL and VOICE_TOKEN come from ai.env. The gateway's root certificate is
      # read from ./voice-ca/ca.pem (see voice/README.md); narration audio is kept in voice-data.
      - VOICE_CA_FILE=/voice-ca/ca.pem
      - VOICE_DATA_DIR=/voice-data
      # Code runners, one per language family. A runner that is not started makes its
      # languages say that they are not available on this server.
      - RUNNER_URL_DOTNET=http://runner-dotnet:8080
      - RUNNER_URL_JVM=http://runner-jvm:8080
      - RUNNER_URL_NATIVE=http://runner-native:8080
      - RUNNER_URL_GO=http://runner-go:8080
      - RUNNER_URL_RUST=http://runner-rust:8080
      - RUNNER_URL_SCRIPT=http://runner-script:8080
    volumes:
      - ./media:/media:ro # your own pictures, audio and video for courses
      - ./courses:/courses:ro # course files to import
      - ./voice-ca:/voice-ca:ro # ca.pem, the voice gateway's root certificate (no secrets)
      - voice-data:/voice-data # narration audio made by the voice server; can be deleted safely
    networks:
      - tunnel
      - backend
      - egress
      - runner-dotnet
      - runner-jvm
      - runner-native
      - runner-go
      - runner-rust
      - runner-script
    depends_on:
      db:
        condition: service_healthy
      egress:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 200

  # Egress proxy for the AI providers. Squid accepts HTTPS tunnels to api.openai.com,
  # api.anthropic.com and generativelanguage.googleapis.com only (squid.conf), so the app's
  # requests stay encrypted end to end and the proxy sees only the host. It is the only
  # service besides the tunnel with a route to the internet. The image runs Squid as its own
  # unprivileged user; no cache and no logs are written to disk.
  egress:
    <<: *hardening
    image: ubuntu/squid:${SQUID_VERSION:?set SQUID_VERSION in .env}
    container_name: lingo-egress
    entrypoint: ["/usr/sbin/squid-gnutls", "-f", "/etc/squid/squid.conf", "-NYC"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=1m,mode=1777
      - /var/log/squid:size=1m,mode=1777
      - /var/spool/squid:size=1m,mode=1777
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - egress
      - egress-out
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

  # Code runners (docs/DESIGN-coding-and-math.md, section 4.4). Each language family has its own
  # image, built from that language's official image with the small runner service of
  # app/runners/service inside. A runner compiles and runs one learner's program at a time as a
  # separate process in a fresh scratch folder on its tmpfs, stops every process the program
  # started when the time limit passes, caps the output and empties the scratch folder after
  # each job. The settings in x-runner are the isolation. No runner is privileged or has any
  # Linux capability, and none can gain privileges. Each runs as an unprivileged user on a
  # read-only root filesystem, with limits on memory (no swap), CPU, processes and open files.
  # Each sits alone with the app on its own internal network, so a program has no route to the
  # internet, to the database or to the other runners, only to the app's web port.
  # Runners start with the profile "runners" (or one family's own profile, for example
  # COMPOSE_PROFILES=dotnet,jvm in .env) and read RUNNER_TOKEN from runner.env.
  runner-dotnet: # C#
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: dotnet/Dockerfile
    image: lingo-runner-dotnet:local
    container_name: lingo-runner-dotnet
    profiles: [runners, dotnet]
    networks: [runner-dotnet]

  runner-jvm: # Java and Kotlin. The Kotlin compiler needs more memory than the others.
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: jvm/Dockerfile
    image: lingo-runner-jvm:local
    container_name: lingo-runner-jvm
    profiles: [runners, jvm]
    networks: [runner-jvm]
    mem_limit: 1280m
    memswap_limit: 1280m

  runner-native: # C and C++ with GCC
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: native/Dockerfile
    image: lingo-runner-native:local
    container_name: lingo-runner-native
    profiles: [runners, native]
    networks: [runner-native]

  runner-go: # Go. Each build gets a fresh copy of the image's standard library cache.
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: go/Dockerfile
    image: lingo-runner-go:local
    container_name: lingo-runner-go
    profiles: [runners, go]
    networks: [runner-go]
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    mem_limit: 1280m
    memswap_limit: 1280m

  runner-rust: # Rust (rustc, no crates)
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: rust/Dockerfile
    image: lingo-runner-rust:local
    container_name: lingo-runner-rust
    profiles: [runners, rust]
    networks: [runner-rust]

  runner-script: # Ruby, PHP, Perl, Lua and Bash
    <<: *runner
    build:
      context: ./app/runners
      dockerfile: script/Dockerfile
    image: lingo-runner-script:local
    container_name: lingo-runner-script
    profiles: [runners, script]
    networks: [runner-script]
    mem_limit: 512m
    memswap_limit: 512m

  # Cloudflare Tunnel connector. The token lives only in cloudflared.env, which no other
  # container reads. The image already runs as a non-root user.
  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?set CLOUDFLARED_VERSION in .env}
    container_name: lingo-tunnel
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: cloudflared.env
    read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tunnel
      - tunnel-out
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 100

volumes:
  db: {}
  # Cached narration audio. Losing it only means the clips are made again on their next play.
  voice-data: {}

# All networks except tunnel-out and egress-out are internal, so they have no route to the
# internet. If Docker reports that it has no free address pools, give each network an explicit
# subnet under ipam.config.
networks:
  # tunnel <-> app.
  tunnel:
    internal: true
  # app <-> db.
  backend:
    internal: true
  # app <-> egress proxy.
  egress:
    internal: true
  # Outbound for the egress proxy only.
  egress-out: {}
  # Outbound for the tunnel connector to reach Cloudflare.
  tunnel-out: {}
  # app <-> one code runner each. A runner shares its network with nothing else.
  runner-dotnet:
    internal: true
  runner-jvm:
    internal: true
  runner-native:
    internal: true
  runner-go:
    internal: true
  runner-rust:
    internal: true
  runner-script:
    internal: true
