# Lingo voice stack for the GPU workstation. It is separate from the Lingo server stack in
# ../docker-compose.yml and from the voice containers of any other project on the same machine.
#
#   kokoro    text to speech (Kokoro, OpenAI-compatible speech endpoint), GPU
#   speaches  speech to text (speaches with a Whisper model), GPU, no internet access
#   gateway   Caddy in front of both: HTTPS from its own certificate authority, a long bearer
#             token on every request, only the speech and transcription endpoints plus health
#   setup     one-off job (profile "setup") that downloads the Whisper model into its volume
#
# Copy voice.env.example to .env, fill it in, and start with
#   docker compose up -d
# README.md in this folder explains the first-time steps, the certificate and the firewall.
#
# Only the gateway publishes a port, on the address set by VOICE_BIND (127.0.0.1 unless you
# change it). Kokoro and speaches sit on an internal network that has no route to the
# internet or to anything else on the machine; the model download happens in the setup job.

name: lingo-voice

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # Text to speech. The Kokoro model is part of the image, so this container needs no
  # internet access at all. It runs as the image's own unprivileged user.
  kokoro:
    <<: [*hardening, *gpu]
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    read_only: true
    tmpfs:
      # The speech code copies a shared library into /tmp and loads it from there, so this
      # one mount has to allow execution (the default for tmpfs is noexec).
      - /tmp:size=256m,mode=1777,exec
      # The start script runs through uv, which keeps a small cache here.
      - /home/appuser/.cache:size=64m,mode=1777
    networks:
      - speech
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 120s

  # Speech to text. HF_HUB_OFFLINE keeps it from fetching anything: the Whisper model comes
  # from the whisper-models volume that the setup job filled. The model leaves the GPU after
  # WHISPER_TTL seconds without use, so an idle voice stack holds almost no video memory.
  speaches:
    <<: [*hardening, *gpu]
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cuda}
    environment:
      - HF_HUB_OFFLINE=1
      - DO_NOT_TRACK=1
      - ENABLE_UI=false
      - LOG_LEVEL=warning
      - WHISPER__TTL=${WHISPER_TTL:-300}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/ubuntu/.cache/huggingface/xet:size=16m,mode=1777
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub:ro
    networks:
      - speech
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 60s

  # The only door. Caddy serves HTTPS on port 8443 with a certificate from its own internal
  # authority (kept in the gateway-data volume, so it survives restarts and updates). It runs
  # as root inside the container with only that one capability and a read-only filesystem,
  # which is enough because it only writes to its two volumes.
  gateway:
    <<: *hardening
    image: caddy:${CADDY_VERSION:-2.11.7-alpine}
    # Refuses to start with a short token, then runs Caddy. The $$ keeps Compose from
    # substituting the variable; the shell inside the container does.
    command:
      - sh
      - -c
      - |
        if [ "$${#VOICE_TOKEN}" -lt 32 ]; then
          echo "VOICE_TOKEN must be at least 32 characters." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      - VOICE_HOST=${VOICE_HOST:?set VOICE_HOST in .env to the address the Lingo server will use}
      - VOICE_TOKEN=${VOICE_TOKEN:?set VOICE_TOKEN in .env}
      - XDG_CONFIG_HOME=/config
      - XDG_DATA_HOME=/data
    # The Caddy binary carries a file capability for low ports (NET_BIND_SERVICE), and Linux
    # refuses to run it when that capability is missing from the container. Port 8443 does not
    # need it, so this grants nothing that is used.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /config:size=4m,mode=0700
      - /tmp:size=4m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data # THE CERTIFICATE AUTHORITY. Losing it means trusting a new one.
    ports:
      - "${VOICE_BIND:-127.0.0.1}:${VOICE_PORT:-8443}:8443"
    networks:
      - speech
      - front
    depends_on:
      kokoro:
        condition: service_healthy
      speaches:
        condition: service_healthy
    healthcheck:
      # Busybox wget does not check certificates; this is a check from inside the container.
      test: ["CMD-SHELL", "wget -q --no-check-certificate --header \"Authorization: Bearer $$VOICE_TOKEN\" -O /dev/null https://127.0.0.1:8443/health || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  # First-time job: downloads the Whisper model into the whisper-models volume. This is the
  # only container of the stack with internet access (through the front network), and it only
  # runs when asked for:  docker compose --profile setup run --rm setup
  setup:
    profiles: ["setup"]
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cuda}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DO_NOT_TRACK=1
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
    entrypoint:
      - python
      - -c
      - |
        import os
        from huggingface_hub import snapshot_download
        model = os.environ["WHISPER_MODEL"]
        path = snapshot_download(model)
        print("Installed", model, "at", path)
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - front

volumes:
  whisper-models: {}
  gateway-data: {}

# Docker may report that it has no free address pools. The subnets are therefore explicit and
# set in .env; pick ranges that nothing else on the machine uses. The defaults are ranges
# reserved for documentation (RFC 5737), which no real network hands out.
networks:
  # kokoro <-> speaches <-> gateway, no route to the internet.
  speech:
    internal: true
    ipam:
      config:
        - subnet: ${VOICE_SPEECH_SUBNET:-198.51.100.0/24}
  # The gateway's published port, and the setup job's way to the model download.
  front:
    ipam:
      config:
        - subnet: ${VOICE_FRONT_SUBNET:-203.0.113.0/24}
